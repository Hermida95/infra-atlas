[project]
name = "brain"
version = "0.1.0"
description = "Infra Atlas content pipeline: schema, validation and graph build."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
