<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infra Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070B;
  --panel:rgba(6,16,24,.62);
  --panel-solid:#07121B;
  --holo:#7FE3FF;
  --holo-2:rgba(127,227,255,.55);
  --holo-line:rgba(127,227,255,.22);
  --holo-faint:rgba(127,227,255,.08);
  --text:#DCF4FF;
  --muted:#7FA3B5;
  --faint:#476373;
  --gold:#FFC46B;
  --gold-soft:rgba(255,196,107,.12);
  --alert:#FF8A6B;
  --font:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 60% 45%,#0A1A26 0%,var(--bg) 62%);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(127,227,255,.014) 0 1px,transparent 1px 3px)}
header{position:fixed;inset:0 0 auto 0;height:60px;display:flex;align-items:center;gap:24px;padding:0 20px;z-index:3;border-bottom:1px solid var(--holo-line);background:rgba(4,7,11,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-weight:500;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
.reactor{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--holo);display:grid;place-items:center;box-shadow:inset 0 0 6px rgba(127,227,255,.5)}
.reactor::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--holo)}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
nav a[aria-current]{color:var(--holo);background:var(--holo-faint)}
nav a:hover{color:var(--text)}
.search{margin-left:auto;position:relative}
.search input{width:240px;height:34px;border-radius:6px;border:1px solid var(--holo-line);background:rgba(127,227,255,.04);color:var(--text);font:inherit;font-family:var(--mono);font-size:12px;padding:0 12px 0 32px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--holo);box-shadow:0 0 0 3px var(--holo-faint)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--muted)}
#stage{position:fixed;top:60px;left:0;width:100vw;height:calc(100dvh - 60px);cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#stage canvas{display:block}
#labels{position:fixed;top:60px;left:0;width:100vw;height:calc(100dvh - 60px);pointer-events:none;z-index:1;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--text);transform-origin:0 0;will-change:transform,opacity;text-shadow:0 0 6px rgba(4,7,11,.9)}
.lb.hub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--holo)}
.lb.on{color:var(--gold)}
.panel{position:fixed;z-index:2;background:var(--panel);border:1px solid var(--holo-line);border-radius:4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--holo);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
@media (prefers-reduced-transparency:reduce){.panel,header{background:var(--panel-solid);backdrop-filter:none}}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--holo-2);margin:0 0 10px}
#planner{top:76px;left:16px;width:380px;max-height:calc(100dvh - 92px);overflow:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--holo-line) transparent}
#planner h1{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25}
#planner p.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:76px;resize:vertical;border-radius:4px;border:1px solid var(--holo-line);background:rgba(127,227,255,.03);color:var(--text);font:inherit;font-size:13px;padding:10px 12px;line-height:1.5}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:none;border-color:var(--holo);box-shadow:0 0 0 3px var(--holo-faint)}
.err{color:var(--alert);font-size:12px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.chip{border:1px solid var(--holo-line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer;transition:color .2s,border-color .2s,background .2s,transform .1s}
.chip:hover{color:var(--text);border-color:var(--holo-2)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.row{display:flex;gap:8px}
.btn{height:36px;padding:0 16px;border-radius:999px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--holo-line);background:transparent;color:var(--text);transition:transform .1s,background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--holo);border-color:var(--holo);color:#03202B}
.btn.primary:hover{background:#A6EDFF}
.btn:not(.primary):hover{background:var(--holo-faint)}
#route{margin-top:20px;border-top:1px solid var(--holo-line);padding-top:16px}
#route:empty{display:none}
.step{margin-bottom:14px;opacity:0;transform:translateX(-6px);animation:in .45s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.step h3{font-size:11px;font-weight:500;color:var(--gold);margin:0 0 6px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.item{display:grid;gap:2px;padding:6px 8px;margin:0 -8px;border-radius:4px;cursor:pointer;border-left:1px solid transparent}
.item:hover,.item:focus-visible{background:var(--gold-soft);border-left-color:var(--gold);outline:none}
.item b{font-weight:500}
.item span{color:var(--muted);font-size:12px}
.note{border:1px solid rgba(255,138,107,.4);background:rgba(255,138,107,.07);color:#FFC2B0;border-radius:4px;padding:10px 12px;font-size:12px;margin-top:8px}
#detail{top:76px;right:16px;width:320px;padding:20px;transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.16,1,.3,1)}
#detail.open{transform:none}
#detail h2{font-size:22px;font-weight:500;margin:0 0 8px}
#detail p{color:#B5D3E0;margin:0 0 16px}
#detail h4{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:4px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.close:hover{background:var(--holo-faint);color:var(--text)}
.soon{font-size:12px;color:var(--faint);border-top:1px solid var(--holo-line);padding-top:12px}
#hud{position:fixed;right:16px;bottom:16px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;text-align:right;line-height:1.9;pointer-events:none}
#hud b{color:var(--holo);font-weight:500}
#hud .g{color:var(--gold)}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;pointer-events:none}
.dhead{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.dhead img{width:34px;height:34px;opacity:.92}
#detail .dhead h2{margin:0}
.ilogo{width:14px;height:14px;opacity:.75;vertical-align:-2px;margin-right:6px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2B1B03;margin-bottom:16px}
.btn.gold:hover{background:#FFD592}
#teardown{position:fixed;top:60px;left:0;width:100vw;height:calc(100dvh - 60px);z-index:4;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 35% 50%,#0A1E2C 0%,#04070B 60%);opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s;scrollbar-width:thin;scrollbar-color:var(--holo-line) transparent}
#teardown.open{opacity:1;visibility:visible;transition:opacity .5s ease}
.td-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px}
.td-stage{position:sticky;top:0;height:calc(100dvh - 60px)}
#tdCanvas{position:absolute;inset:0}
#tdCanvas canvas{display:block}
#tdLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pl{position:absolute;left:0;top:0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;transition:color .3s;will-change:transform,opacity}
.pl.act{color:var(--text)}
.td-col{padding:0 40px 0 8px}
.td-sec{min-height:78vh;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--holo-line);padding-left:28px;transition:border-color .4s}
.td-sec.act{border-left-color:var(--holo)}
.td-sec.intro{min-height:calc(100dvh - 60px)}
.td-sec .bigLogo{width:64px;height:64px;margin-bottom:20px}
.td-sec h2{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:0 0 12px}
.td-sec h3{font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0 0 10px}
.td-sec p{color:#B5D3E0;margin:0;max-width:52ch;font-size:15px;line-height:1.65}
.td-sec .hint{color:var(--faint);font-family:var(--mono);font-size:12px;margin-top:20px}
.td-sec.outro{min-height:60vh}
.td-back{position:fixed;top:76px;left:16px;z-index:5;display:none}
#teardown.open~.td-back{display:inline-flex;align-items:center}
.td-sec.lab{min-height:calc(100dvh - 60px)}
.df{font-family:var(--mono);font-size:12.5px;border:1px solid var(--holo-line);border-radius:4px;background:rgba(127,227,255,.03);padding:8px 0;margin:18px 0 16px}
.dl{display:flex;justify-content:space-between;gap:12px;padding:5px 14px;color:var(--faint);border-left:2px solid transparent;transition:color .3s,background .3s,border-color .3s}
.dl code{font-family:inherit;white-space:pre}
.dl.done{color:var(--text)}
.dl.cur{border-left-color:var(--holo);background:var(--holo-faint)}
.dl .st{font-size:11px;white-space:nowrap;color:var(--muted)}
.dl.cached .st{color:var(--holo)}
.dl.rebuilt{border-left-color:var(--text)}
.dl.rebuilt .st{color:var(--text)}
.labbar{display:flex;flex-wrap:wrap;gap:8px}
.btn.sm{height:32px;padding:0 14px;font-size:12px}
.labimg{font-family:var(--mono);font-size:12px;color:var(--holo)!important;margin-top:16px!important}
.labmsg{min-height:80px;margin-top:8px!important}
@media (prefers-reduced-motion:reduce){#teardown{transition:none}}
@media (max-width:767px){
  .td-grid{grid-template-columns:1fr}
  .td-stage{height:45dvh;z-index:1}
  .td-col{padding:0 16px;position:relative;z-index:2;background:linear-gradient(transparent,rgba(4,7,11,.9) 12%)}
  .td-sec{min-height:60vh}
  .td-sec h2{font-size:30px}
}
@media (max-width:767px){
  body{overflow:auto}
  header{gap:12px}
  nav,#hint{display:none}
  .search input{width:150px}
  #stage,#labels{position:absolute;height:60dvh}
  #planner,#detail{position:relative;top:auto;left:auto;right:auto;width:auto;max-height:none;margin:12px 16px;transform:none}
  #planner{margin-top:calc(60dvh + 72px)}
  #detail{display:none}
  #detail.open{display:block}
  #hud{display:none}
}
@media (prefers-reduced-motion:reduce){.step{animation:none;opacity:1;transform:none}#detail{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="reactor" aria-hidden="true"></span>Infra Atlas</div>
  <nav aria-label="Main">
    <a href="#" aria-current="page">Map</a>
    <a href="#">Journeys</a>
    <a href="#">Labs</a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a concept" aria-label="Find a concept">
  </div>
</header>

<div id="stage" aria-label="3D knowledge map of DevOps and AWS concepts. Drag to rotate, scroll to zoom, click a node for details."></div>
<div id="labels" aria-hidden="true"></div>

<aside id="planner" class="panel" aria-labelledby="pt">
  <p class="tag">Deployment planner</p>
  <h1 id="pt">What are you deploying?</h1>
  <p class="sub">Describe your app. The map lights up the pieces you need and the order to wire them.</p>
  <label class="f" for="desc">Your app</label>
  <textarea id="desc" placeholder="A FastAPI app with Postgres, user login and image uploads, on a small budget"></textarea>
  <p class="err" id="err" role="alert"></p>
  <div class="chips" id="chips" aria-label="Requirements"></div>
  <div class="row">
    <button class="btn primary" id="go">Light up my route</button>
    <button class="btn" id="clear">Clear</button>
  </div>
  <div id="route" aria-live="polite"></div>
</aside>

<aside id="detail" class="panel" aria-live="polite">
  <button class="close" id="dclose" aria-label="Close">×</button>
  <p class="tag" id="ddom"></p>
  <div class="dhead"><img id="dlogo" alt=""><h2 id="dtitle"></h2></div>
  <p id="dtext"></p>
  <button class="btn gold" id="dteardown">Take it apart</button>
  <h4>Connected to</h4>
  <div class="links" id="dlinks"></div>
  <div class="soon">Interactive lesson for this concept lands in phase 1.</div>
</aside>

<section id="teardown" aria-label="Technology teardown" aria-hidden="true">
  <div class="td-grid">
    <div class="td-stage"><div id="tdCanvas"></div><div id="tdLabels" aria-hidden="true"></div></div>
    <div class="td-col" id="tdCol"></div>
  </div>
</section>
<button class="btn td-back" id="tdBack">Back to map</button>

<div id="hud" aria-live="polite"></div>
<div id="hint">Drag to rotate · scroll to zoom · click a node</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DOMAINS={
  local:{name:"Local",x:-1.05,y:.05,z:0,h:200},
  containers:{name:"Containers",x:-.55,y:-.5,z:.35,h:192},
  cicd:{name:"CI/CD",x:-.6,y:.55,z:-.35,h:210},
  iac:{name:"Infrastructure as code",x:-.02,y:-.68,z:.3,h:222},
  orch:{name:"Kubernetes",x:0,y:.02,z:0,h:186},
  security:{name:"Security",x:-.05,y:.68,z:-.35,h:205},
  network:{name:"Networking",x:.55,y:-.55,z:.35,h:196},
  compute:{name:"Compute",x:.5,y:.05,z:-.1,h:214},
  obs:{name:"Observability",x:.5,y:.66,z:-.35,h:178},
  data:{name:"Data",x:1.05,y:-.2,z:.3,h:170},
  ai:{name:"AI",x:1.05,y:.5,z:-.3,h:230}
};
const N=[
 ["localhost","Localhost","local",1,"Where every app starts. Your machine, your rules, nothing in between."],
 ["git","Git","local",0,"Version control. Every change is tracked and every push can trigger a pipeline."],
 ["app","Python app","local",0,"Your FastAPI or Django code and its dependencies."],
 ["env","Env variables","local",0,"Configuration that changes per environment, kept out of the code."],
 ["docker","Docker","containers",1,"Packages your app and everything it needs so it runs the same on any machine."],
 ["dockerfile","Dockerfile","containers",0,"The recipe. Each instruction produces one layer of the image."],
 ["image","Image","containers",0,"A read-only, versioned stack of layers. The thing you ship."],
 ["container","Container","containers",0,"A running image plus a thin writable layer on top."],
 ["layers","Layers","containers",0,"Cached filesystem snapshots. Order them well and rebuilds take seconds."],
 ["compose","Docker Compose","containers",0,"Runs several containers together locally: app, database, cache."],
 ["ecr","ECR","containers",0,"AWS private registry. Your cloud services pull images from here."],
 ["terraform","Terraform","iac",1,"Describes infrastructure as code, then makes reality match it."],
 ["tfstate","State","iac",0,"Terraform's memory of what exists. Usually stored in S3 with a lock."],
 ["tfmodules","Modules","iac",0,"Reusable infrastructure building blocks."],
 ["tfplan","Plan and apply","iac",0,"Plan shows the diff between code and reality. Apply makes it happen."],
 ["kubernetes","Kubernetes","orch",1,"Keeps the desired number of containers running, healed and reachable."],
 ["pod","Pod","orch",0,"The smallest unit Kubernetes schedules: one or more containers together."],
 ["deployment","Deployment","orch",0,"Declares how many pods you want and how to roll out new versions."],
 ["k8ssvc","Service","orch",0,"A stable address in front of pods that come and go."],
 ["ingress","Ingress","orch",0,"Routes outside HTTP traffic to the right service."],
 ["helm","Helm","orch",0,"Package manager for Kubernetes manifests."],
 ["hpa","Autoscaler","orch",0,"Adds or removes pods based on load."],
 ["vpc","VPC","network",0,"Your private network in AWS, split into public and private subnets."],
 ["alb","Load balancer","network",0,"Spreads traffic across healthy targets."],
 ["cloudfront","CloudFront","network",0,"CDN that serves content from locations close to your users."],
 ["route53","Route 53","network",0,"DNS. Points your domain at your infrastructure."],
 ["apigw","API Gateway","network",0,"Front door for HTTP APIs, with throttling and auth."],
 ["waf","WAF","network",0,"Filters malicious traffic before it reaches your app."],
 ["aws","AWS","compute",1,"The cloud provider this map is built around."],
 ["lambda","Lambda","compute",0,"Runs code per request. Scales to zero when idle."],
 ["ecs","ECS Fargate","compute",0,"Runs containers without managing servers."],
 ["eks","EKS","compute",0,"Managed Kubernetes control plane on AWS."],
 ["ec2","EC2","compute",0,"Virtual machines. Full control, full responsibility."],
 ["rds","RDS Postgres","data",0,"Managed relational database with backups and failover."],
 ["dynamodb","DynamoDB","data",0,"Serverless key-value database with single-digit millisecond reads."],
 ["s3","S3","data",0,"Object storage for files, static sites, backups and state."],
 ["elasticache","ElastiCache","data",0,"Managed Redis for caching and sessions."],
 ["sqs","SQS","data",0,"Message queue. Moves slow work out of the request path."],
 ["iam","IAM","security",0,"Who can do what. Least privilege for every service."],
 ["cognito","Cognito","security",0,"User sign-up, login and tokens."],
 ["ssm","Secrets","security",0,"Passwords and keys stored encrypted, never in code."],
 ["oidc","OIDC","cicd",0,"Lets your pipeline assume an AWS role without stored keys."],
 ["gha","GitHub Actions","cicd",1,"Builds, tests and deploys on every push."],
 ["tests","Tests","cicd",0,"Unit, integration and smoke tests that gate every deploy."],
 ["cloudwatch","CloudWatch","obs",1,"Logs, metrics and alarms for everything on AWS."],
 ["xray","X-Ray","obs",0,"Traces one request across every service it touches."],
 ["prometheus","Prometheus","obs",0,"Scrapes and stores metrics, the standard in Kubernetes."],
 ["grafana","Grafana","obs",0,"Dashboards on top of your metrics."],
 ["budgets","Budgets","obs",0,"Alerts before the bill surprises you."],
 ["bedrock","Bedrock","ai",1,"Managed access to foundation models such as Claude, inside AWS."],
 ["embeddings","Embeddings","ai",0,"Text turned into vectors, so meaning becomes searchable."],
 ["vectordb","Vector store","ai",0,"Finds the documents closest in meaning to a question."],
 ["rag","RAG","ai",0,"Retrieve your own documents, then let the model answer from them."]
];
const E=`localhost-git localhost-app localhost-env localhost-docker app-dockerfile git-gha docker-dockerfile docker-image docker-container dockerfile-image image-layers image-container docker-compose compose-container image-ecr ecr-aws terraform-tfstate terraform-tfmodules terraform-tfplan terraform-aws tfstate-s3 terraform-gha kubernetes-pod kubernetes-deployment kubernetes-k8ssvc kubernetes-ingress kubernetes-helm kubernetes-hpa deployment-pod pod-container ingress-alb kubernetes-eks helm-gha aws-lambda aws-ecs aws-eks aws-ec2 aws-vpc aws-iam aws-s3 aws-cloudwatch ecs-ecr lambda-ecr eks-ec2 ecs-alb alb-vpc lambda-apigw apigw-cloudfront cloudfront-s3 route53-cloudfront waf-cloudfront waf-alb rds-vpc elasticache-vpc ecs-vpc eks-vpc lambda-sqs ecs-sqs lambda-dynamodb rds-ssm iam-oidc oidc-gha gha-tests gha-ecr iam-cognito cognito-apigw ssm-env cloudwatch-xray cloudwatch-budgets prometheus-grafana prometheus-kubernetes cloudwatch-lambda cloudwatch-ecs bedrock-aws bedrock-embeddings embeddings-vectordb vectordb-rag rag-bedrock vectordb-s3 ecs-rds lambda-rds alb-cloudfront`.split(" ").map(s=>{const[a,b]=s.split("-");return{a,b}});

const nodes=N.map(([id,label,d,hub,text],i)=>({i,id,label,d,hub:!!hub,text}));
const byId=new Map(nodes.map(n=>[n.id,n]));
const links=E.filter(l=>byId.has(l.a)&&byId.has(l.b)).map(l=>({s:byId.get(l.a),t:byId.get(l.b)}));
const adj=new Map(nodes.map(n=>[n.id,new Set()]));
links.forEach(l=>{adj.get(l.s.id).add(l.t.id);adj.get(l.t.id).add(l.s.id)});

const REQS=[
 {id:"api",label:"Python API",kw:["api","fastapi","django","flask","backend"]},
 {id:"web",label:"Web frontend",kw:["web","frontend","react","next","website","site"]},
 {id:"sql",label:"Relational database",kw:["postgres","postgresql","sql","mysql","database","relational"]},

const DF=[
  ["FROM python:3.12-slim",0,1,"FROM pulls the base image: a slim Linux plus Python. You never rebuild these layers yourself."],
  ["COPY requirements.txt .",1,.4,"Only the dependency list is copied first. This ordering is the trick that makes rebuilds fast. Keep going."],
  ["RUN pip install -r requirements.txt",1,1,"RUN executes and freezes the result as a read-only layer. This is the slow, heavy step."],
  ["COPY . .",2,1,"Your code goes in last, because it is what changes most often."],
  ['CMD ["uvicorn", "main:app"]',3,1,"Metadata only: how to start the app. The image is complete. Run a container from it."]
];
function labHTML(){
  return `<section class="td-sec lab" data-i="lab"><p class="tag">Lab</p><h3>Build it yourself</h3>
  <p>Step through the Dockerfile, start containers from the image, then change the code and watch the cache.</p>
  <div class="df" id="labDf">${DF.map((l,i)=>`<div class="dl" data-l="${i}"><code>${l[0].replace(/</g,"&lt;")}</code><span class="st"></span></div>`).join("")}</div>
  <div class="labbar"><button class="btn primary sm" id="labNext">Build next step</button><button class="btn sm" id="labRun">docker run</button><button class="btn sm" id="labEdit">Edit app.py and rebuild</button><button class="btn sm" id="labReset">Reset</button></div>
  <p class="labimg" id="labImg"></p>
  <p class="labmsg" id="labMsg" aria-live="polite"></p></section>`;
}
function wireLab(){$("labNext").onclick=labNext;$("labRun").onclick=labRun;$("labEdit").onclick=labEdit;$("labReset").onclick=labReset}
function labLines(){
  const lab=td.lab;
  document.querySelectorAll("#labDf .dl").forEach((el,i)=>{
    el.className="dl"+(i<lab.step?" done":"")+(i===lab.step-1&&!lab.ver?" cur":"")+(lab.ver&&i<3?" cached":"")+(lab.ver&&i>=3?" rebuilt":"");
    el.querySelector(".st").textContent=lab.ver?(i<3?"cached":"rebuilt"):"";
  });
  $("labImg").textContent=lab.step<DF.length?(lab.step?`Building, ${lab.step} of ${DF.length}`:"No image yet"):`Image myapp:1.${lab.ver}, read-only`+(lab.c?`, ${lab.c} container${lab.c>1?"s":""} running`:"");
}
function labMsg(t){$("labMsg").textContent=t}
function labReset(){
  const lab=td.lab;lab.step=0;lab.c=0;lab.ver=0;

  td.ctrs.forEach(c=>c.drop=null);

function labNext(){

  const[,pi,v,m]=DF[lab.step],p=td.parts[pi],now=performance.now();

}
function labRun(){
  const lab=td.lab;

  if(lab.c>=3){labMsg("Three containers, one image. The image is stored once; each container only adds its own thin writable layer.");return}
  td.ctrs[lab.c].drop=performance.now();lab.c++;labLines();
  labMsg(lab.c===1?"A container is the image plus a thin writable layer. Whatever it writes lives only there and is gone when the container is removed.":"Another container, same read-only layers underneath. That is why containers start in seconds and barely use extra disk.");
}
function labEdit(){

  const now=performance.now();lab.ver++;lab.c=0;td.ctrs.forEach(c=>c.drop=null);
  td.parts.forEach((p,i)=>{if(i<2){p.flash=now;p.state="cached"}else if(i<4){p.drop=now+(i-2)*280;p.state="rebuilt"}});

  td.parts.forEach((p,i)=>{
    tv.copy(p.anchor);p.g.localToWorld(tv);tv.project(tdCam);
    p.el.style.opacity=(p.lo*(td.act>=0&&td.act!==i&&!td.labOn?.5:1)).toFixed(2);
    p.el.style.transform=`translate(${((tv.x+1)/2*tdW+6).toFixed(1)}px,${((1-tv.y)/2*tdH-9).toFixed(1)}px)`;
    p.el.classList.toggle("act",td.act===i&&!td.labOn);
  });
  td.ctrs.forEach(ct=>{
    tv.set(66,0,0);ct.g.localToWorld(tv);tv.project(tdCam);
    ct.el.style.opacity=(ct.vis||0).toFixed(2);
    ct.el.style.transform=`translate(${((tv.x+1)/2*tdW+6).toFixed(1)}px,${((1-tv.y)/2*tdH-9).toFixed(1)}px)`;
  });
}

size();addEventListener("resize",()=>{size();if(td.open)tdSize()});
requestAnimationFrame(frame);
</script>
</body>
</html>
