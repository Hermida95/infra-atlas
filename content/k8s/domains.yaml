# Areas of the Kubernetes atlas. Same shape as ../domains.yaml, but this map is not a journey
# either: it is a cluster read from the object outwards. `fundamentals` sits near the centre
# because every other area is reached through the API; the control plane and the node sit to the
# left, on the side that makes the objects real; the resources a workload consumes -- network,
# storage, configuration -- sit to the right; security and observability wrap the whole thing;
# and extension, delivery and day two sit outside it, where the cluster meets the people.
