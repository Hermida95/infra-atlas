name: release

# Publishes the API image that a cluster or Lambda deploys, only from main:
#   build -> scan (fails on HIGH/CRITICAL) -> push to GHCR with SBOM and provenance -> sign.
# Deploy by the digest this prints, never by a tag: the digest names exact, signed bytes.
#
# This is the *only* place the API image is built. There is deliberately no `push` trigger:
# deploy.yml calls this workflow on a merge to main and promotes the digest it returns into
# each environment, so one commit produces one image and "what is running in prod" has one
# answer. A push trigger here as well would build the same commit twice -- the builds are not
# reproducible, so that is two digests -- and the thing that got deployed would not be the
# thing that got scanned and signed, which is the whole claim of decision 5 and of the
# `promotion` card.
on:
  workflow_call:
    outputs:
      image:
        description: The GHCR repository, lowercased, without a tag or digest.
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: >-
          Digest of what was pushed and signed. buildx with an SBOM and provenance publishes
          an OCI index, so this names the index; the platform manifest inside it is what
          deploy.yml promotes, read back out of this index after verifying its signature.
        value: ${{ jobs.image.outputs.digest }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Build, scan, publish and sign the API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/infra-atlas-api
      id-token: write # keyless cosign signature: GitHub's OIDC identity, no stored keys
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/infra-atlas-api
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches in a job that publishes and signs: a poisoned cache would end up inside a
      # signed image. The model is downloaded fresh and checked against its pinned SHA-256.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --all-packages
      - run: uv run brain graph
      - run: uv run brain embed

      - name: Image name
        id: name
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: infra-atlas-api:scan
          build-args: REVISION=${{ github.sha }}
      - name: Scan before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: infra-atlas-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same layers as the scanned build (the builder reuses them), plus an SBOM (what is inside)
      # and SLSA provenance (how, where and from which commit it was built).
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ steps.name.outputs.image }}
        run: |
          {
            echo "### API image published"
            echo
            echo "\`${IMAGE_NAME}@${DIGEST}\`"
            echo
            echo "Verify the signature:"
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE_NAME}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Deploy it by digest:"
            echo
            echo '```bash'
            echo "helm upgrade --install atlas infra/helm/api --set image.repository=${IMAGE_NAME} --set image.digest=${DIGEST} --set image.pullPolicy=IfNotPresent"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
