name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the token can read the code and nothing else. Jobs that need more ask
# for it themselves (none here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Brain and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages
      # bge-small-en-v1.5 (~67 MB) downloads once from Hugging Face, then comes from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/data/models
          key: fastembed-bge-small-en-v1.5-${{ hashFiles('uv.lock') }}
          restore-keys: fastembed-bge-small-en-v1.5-
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # REQUIRE_EMBEDDINGS: the retrieval-quality test must run here, never skip.
      - run: uv run pytest -q
        env:
          REQUIRE_EMBEDDINGS: "1"
      # `brain validate`, the schema drift check and the retrieval-quality report live in
      # content.yml, which only runs when the content or the pipeline changes. What stays here
      # is what the two jobs below consume: the graph and the vector index.
      - run: uv run brain graph
      - run: uv run brain embed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph
          path: apps/web/src/data/graph.json

  web:
    name: Web build
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph
          path: apps/web/src/data
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web logos
      - run: pnpm --filter web test
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  api-image:
    name: API image
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph
          path: apps/web/src/data
      # The image ships the vector index and the model: build them like the python job does.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/data/models
          key: fastembed-bge-small-en-v1.5-${{ hashFiles('uv.lock') }}
          restore-keys: fastembed-bge-small-en-v1.5-
      - run: uv run brain embed
      - run: docker build -f apps/api/Dockerfile -t infra-atlas-api:ci .
      - name: Semantic search inside the image (read-only, offline model)
        run: |
          docker image ls infra-atlas-api:ci --format 'Image size: {{.Size}}'
          du -sh apps/api/data/models apps/api/data/vectors.lance
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 infra-atlas-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health >/dev/null 2>&1 && break; sleep 1; done
          for q in "where do I keep database passwords" "run code without managing servers" \
                   "restart crashed containers automatically" "spread traffic across instances" \
                   "hand slow work to a background worker" "point my domain name at the server"; do
            curl -fsS --get localhost:8000/search --data-urlencode "q=$q" --data-urlencode k=3 \
              | python3 -c 'import json, sys; r = json.load(sys.stdin); print(repr(r["query"]), "->", [(h["id"], h["score"]) for h in r["hits"]])'
          done
          docker stats --no-stream --format 'Memory after search: {{.MemUsage}}' api
      - name: Ready inside the image
        run: curl -fsS localhost:8000/ready
      # Known vulnerabilities in the OS packages and Python libraries baked into the image.
      # Fails on HIGH or CRITICAL with a fix available; .trivyignore records accepted ones.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: infra-atlas-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Container logs
        if: failure()
        run: docker logs api || true

  terraform:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Downloaded and checksum-verified rather than installed by a third-party action: the
      # same reasoning as pinning every action by SHA (docs/SEGURIDAD.md). Bump the version
      # and the hash together; the hashes come from the publishers' own SHA256SUMS files.
      TERRAFORM_VERSION: 1.14.4
      TERRAFORM_SHA256: 4a24b18865d9419ba7882567cb7429dd1525b3e2029a9e38f612d476ba8c3dea
      TFLINT_VERSION: 0.60.0
      TFLINT_SHA256: 3476ceedcf0c4f9f2bed35e92988e1411bec2caa543c9387bffaa720df9efaf7
      CHECKOV_VERSION: 3.2.489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform and tflint
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSLo "$tmp/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $tmp/terraform.zip" | sha256sum -c -
          curl -sSLo "$tmp/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $tmp/tflint.zip" | sha256sum -c -
          unzip -o -q "$tmp/terraform.zip" -d /usr/local/bin
          unzip -o -q "$tmp/tflint.zip" -d /usr/local/bin
          terraform version
          tflint --version

      # Formatting first: it is the cheapest failure and the one that makes every diff noisy.
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: no credentials, no state bucket, nothing to lock. validate type-checks
      # the configuration and the wiring between modules; it never calls AWS.
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in infra/terraform/bootstrap infra/terraform/modules/* infra/terraform/envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: tflint
        env:
          # tflint downloads its AWS ruleset from GitHub releases; without a token the
          # anonymous API rate limit is what fails the job, not the code.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tflint --chdir=infra/terraform --init
          for dir in infra/terraform/bootstrap infra/terraform/modules/* infra/terraform/envs/*; do
            echo "::group::$dir"
            tflint --chdir="$dir" --config="$PWD/infra/terraform/.tflint.hcl"
            echo "::endgroup::"
          done

      # Decision 10: "escaneo del código Terraform (checkov)". Every accepted finding is a
      # `checkov:skip` next to the resource with the reason on the line, so this job failing
      # means something new and undocumented.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: checkov
        run: uvx "checkov==${CHECKOV_VERSION}" --directory infra/terraform --framework terraform --compact --quiet
