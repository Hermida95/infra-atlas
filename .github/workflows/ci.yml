name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Content, brain and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run brain validate
      - run: uv run brain graph
      - uses: actions/upload-artifact@v4
        with:
          name: graph
          path: apps/web/src/data/graph.json

  web:
    name: Web build
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graph
          path: apps/web/src/data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web logos
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  api-image:
    name: API image
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graph
          path: apps/web/src/data
      - run: docker build -f apps/api/Dockerfile -t infra-atlas-api:ci .
