# Weekly update PRs for every dependency source, including the pinned action SHAs and the
# base image digests (a pin without an update path just freezes vulnerabilities in place).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups:
      web: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /apps/api
    schedule: {interval: weekly}
