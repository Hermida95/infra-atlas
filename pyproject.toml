[tool.uv.workspace]
members = ["packages/brain", "apps/api"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["brain", "api"]

[tool.pytest.ini_options]
testpaths = ["packages/brain/tests", "apps/api/tests"]
addopts = ["--import-mode=importlib"]
