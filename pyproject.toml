[tool.uv.workspace]
members = ["packages/brain", "apps/api"]

[tool.uv]
# fastembed 0.9 caps pillow below 13, and pillow 12.x has known CVEs in its image decoders
# (TIFF, GIF, PPM, PDF, EPS). Only text embedding is used, which never touches pillow, and
# CI runs the real model on pillow 13. Drop this once fastembed allows pillow 13.
override-dependencies = ["pillow>=13"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["brain", "api"]

[tool.pytest.ini_options]
testpaths = ["packages/brain/tests", "apps/api/tests"]
addopts = ["--import-mode=importlib"]
