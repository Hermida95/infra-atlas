[project]
name = "api"
version = "0.1.0"
description = "Infra Atlas HTTP API."
requires-python = ">=3.12"
dependencies = [
  "brain[search]",
  "fastapi>=0.115",
  "prometheus-client>=0.21",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.uv.sources]
brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
